<ion-app>
  <ion-content [fullscreen]="true">
<!-- Encabezado de la página -->
      <ion-header>
        <ion-toolbar> <!-- Barra de herramientas dentro del encabezado -->

          <!-- Botón de menú en la parte izquierda del toolbar -->
          <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú lateral -->
          </ion-buttons>

          <!-- Título de la página con el logo -->
          <ion-title>
            <div class="logo-principal">
              <img class="imgagen-logo" src="assets/icon/1611770034484.png" alt="logo" />
            </div>
          </ion-title>

        </ion-toolbar>
      </ion-header>

    <div class="ion-padding">
      <h2>GESTIÓN DE PRODUCTOS</h2>

      <form (ngSubmit)="createOrUpdateTShirt()">
        <input type="text" [value]="selectedTShirt.material" (input)="selectedTShirt.material = $any($event.target).value" name="material" placeholder="Material" required />
        <input type="text" [(ngModel)]="selectedTShirt.size" name="size" placeholder="Talla" required />
        <textarea [(ngModel)]="selectedTShirt.description" name="description" placeholder="Descripción" required></textarea>
        <input type="number" [(ngModel)]="selectedTShirt.price" name="price" placeholder="Precio" required />
        
        <!-- Input para seleccionar imagen desde el PC -->
        <input type="file" (change)="uploadImage($event)" accept="image/*" title="Selecciona una imagen desde tu equipo" />

        <!-- Vista previa de la imagen cargada -->
        <div *ngIf="selectedTShirt.imageUrl" class="ion-margin-top">
          <img [src]="selectedTShirt.imageUrl" alt="Vista previa" width="150" />
        </div>

        <div class="button-container ion-margin-top">
          <button type="submit">{{ selectedTShirt.id ? 'Actualizar' : 'Crear' }}</button>
          <button type="button" *ngIf="selectedTShirt.id" (click)="resetForm()">Cancelar</button>
        </div>
      </form>

      <hr class="ion-margin-vertical" />

      <!-- Lista de camisetas -->
      <div class="card-container">
        <div class="card" *ngFor="let tshirt of tshirts">
          <img class="card-img" *ngIf="tshirt.imageUrl" [src]="tshirt.imageUrl" alt="Imagen de camiseta" />
          <div class="card-body">
            <h3>{{ tshirt.material }}</h3>
            <p>Talla: {{ tshirt.size }}</p>
            <p>{{ tshirt.description }}</p>
            <p>Precio: ${{ tshirt.price }} CLP</p>

            <div class="button-container">
              <button (click)="editTShirt(tshirt)">Editar</button>
              <button (click)="deleteTShirt(tshirt)">Eliminar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ion-content>
</ion-app>
